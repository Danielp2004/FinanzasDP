<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnóstico</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; background:#0f1520; color:#e2e8f0; }
    h1 { font-size: 20px; }
    button { display:block; width:100%; padding: 14px; margin: 8px 0; font-size: 15px; border:0; border-radius:10px; background:#00d4aa; color:#04211a; font-weight:700; cursor:pointer; }
    button.sec { background:#1e293b; color:#e2e8f0; }
    pre { background:#020617; color:#a5f3d0; padding:14px; border-radius:10px; overflow:auto; font-size:12px; white-space:pre-wrap; max-height:60vh; }
    .err { color:#fca5a5; }
    .ok { color:#6ee7b7; }
    #status { padding:10px; border-radius:8px; background:#1e293b; margin:10px 0; }
  </style>
</head>
<body>
  <h1>🔧 Diagnóstico Finanzas AI</h1>
  <div style="background:#065f46;color:#a7f3d0;padding:8px;border-radius:8px;margin-bottom:10px">
    VERSIÓN: <b>v3</b> · Si NO ves "v3" aquí, tu navegador tiene caché vieja.
  </div>
  <div id="status">Listo. Pulsa un botón para probar el backend.</div>

  <!-- Botón de prueba PURA (sin backend): si este no responde, el JS no cargó -->
  <button style="background:#f59e0b;color:#000" onclick="document.getElementById('out').textContent='✅ El JavaScript SÍ funciona. ' + new Date().toLocaleTimeString();">
    0 · PRUEBA PURA (sin servidor) — pulsa esto primero
  </button>

  <button onclick="test('diagnosticarDatos')">1 · Probar diagnosticarDatos()</button>
  <button class="sec" onclick="test('getDataAPI', mesActual())">2 · Probar getDataAPI(mes actual)</button>
  <button class="sec" onclick="test('getDataAPI', '2026-05')">3 · Probar getDataAPI(2026-05) — mes con datos</button>
  <button class="sec" onclick="test('getDataAPILight', '2026-05')">4 · Probar getDataAPILight(2026-05)</button>
  <button class="sec" onclick="test('probarClaveIA')">5 · Probar clave IA (OpenRouter)</button>

  <pre id="out">—</pre>

  <script>
    // Al cargar: confirmar que el JS corre y si google.script.run existe.
    window.addEventListener('DOMContentLoaded', function () {
      var ok = (typeof google !== 'undefined' && google.script && google.script.run);
      document.getElementById('status').textContent =
        'JS cargado ✓ · google.script.run: ' + (ok ? 'DISPONIBLE ✓' : 'NO DISPONIBLE ✗ (problema de entorno)');
      document.getElementById('status').className = ok ? 'ok' : 'err';
    });
    function mesActual() {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    }
    function setStatus(txt, cls) {
      var s = document.getElementById('status');
      s.textContent = txt;
      s.className = cls || '';
    }
    function test(fn, arg) {
      var out = document.getElementById('out');
      out.textContent = 'Llamando a ' + fn + '(' + (arg !== undefined ? JSON.stringify(arg) : '') + ') ...';
      setStatus('⏳ Ejecutando ' + fn + '... (si tarda >15s hay un cuelgue en el backend)', '');
      var t0 = Date.now();
      var timeout = setTimeout(function () {
        setStatus('⚠️ Sin respuesta en 15s. El backend probablemente se está colgando en ' + fn + '.', 'err');
      }, 15000);

      var runner = google.script.run
        .withSuccessHandler(function (r) {
          clearTimeout(timeout);
          var ms = Date.now() - t0;
          setStatus('✅ ' + fn + ' respondió en ' + ms + ' ms', 'ok');
          try { out.textContent = JSON.stringify(r, null, 2); }
          catch (e) { out.textContent = String(r); }
        })
        .withFailureHandler(function (e) {
          clearTimeout(timeout);
          var ms = Date.now() - t0;
          setStatus('❌ ' + fn + ' FALLÓ en ' + ms + ' ms', 'err');
          out.textContent = 'ERROR: ' + (e && e.message ? e.message : e);
        });

      if (arg !== undefined) runner[fn](arg);
      else runner[fn]();
    }
  </script>
</body>
</html>
