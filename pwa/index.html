<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanzas AI Pro</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0f14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas AI">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">

  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; padding: 0; background: #0b0f14; overflow: hidden; }
    #webappFrame {
      display: none;
      width: 100%; height: 100%; border: none;
    }
    #setupScreen {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box; overflow-y: auto; overflow-x: hidden;
      font-family: system-ui, -apple-system, sans-serif; color: #e5e9ee;
    }
    #setupScreen .box { width: 100%; max-width: 420px; min-width: 0; box-sizing: border-box; }
    #setupScreen h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
    #setupScreen p { font-size: 13px; color: #9aa4b2; margin: 0 0 24px; line-height: 1.5; }
    #setupScreen label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 6px; }
    #setupScreen input {
      width: 100%; box-sizing: border-box; padding: 11px; border-radius: 10px;
      border: 1px solid #2a323d; background: #141a22; color: #e5e9ee; font-size: 14px;
      margin-bottom: 14px;
    }
    #setupScreen button {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      background: #3b82f6; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    #setupError { color: #ef4444; font-size: 12px; margin-top: 12px; display: none; }
    #changeUrlBtn {
      position: fixed; bottom: 10px; right: 10px; z-index: 10;
      background: rgba(20,26,34,.85); color: #9aa4b2; border: 1px solid #2a323d;
      border-radius: 8px; padding: 6px 10px; font-size: 11px; font-family: system-ui, sans-serif;
      display: none;
    }
  </style>
</head>
<body>

  <div id="setupScreen">
    <div class="box">
      <h1>Conectar Finanzas AI</h1>
      <p>Pega la URL de tu Web App de Apps Script (Implementar → Administrar implementaciones → copiar URL).</p>
      <label for="setupUrl">URL del Web App</label>
      <input id="setupUrl" type="url" placeholder="https://script.google.com/macros/s/AKfycb.../exec">
      <button id="setupSave">Conectar</button>
      <p id="setupError"></p>
    </div>
  </div>

  <iframe id="webappFrame" allow="clipboard-write"></iframe>
  <button id="changeUrlBtn">Cambiar URL</button>

  <script>
    const STORAGE_KEY = 'fz_webapp_url';
    const frame = document.getElementById('webappFrame');
    const setupScreen = document.getElementById('setupScreen');
    const changeBtn = document.getElementById('changeUrlBtn');

    function isValidUrl(url) {
      return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url);
    }

    function loadApp(url) {
      frame.src = url;
      frame.style.display = 'block';
      setupScreen.style.display = 'none';
      changeBtn.style.display = 'block';
    }

    function showSetup() {
      frame.style.display = 'none';
      setupScreen.style.display = 'flex';
      changeBtn.style.display = 'none';
    }

    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && isValidUrl(saved)) {
      loadApp(saved);
    }

    document.getElementById('setupSave').addEventListener('click', () => {
      const url = document.getElementById('setupUrl').value.trim();
      const errEl = document.getElementById('setupError');
      if (!isValidUrl(url)) {
        errEl.textContent = 'La URL debe ser del tipo https://script.google.com/macros/s/.../exec';
        errEl.style.display = 'block';
        return;
      }
      localStorage.setItem(STORAGE_KEY, url);
      loadApp(url);
    });

    changeBtn.addEventListener('click', () => {
      document.getElementById('setupUrl').value = localStorage.getItem(STORAGE_KEY) || '';
      showSetup();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(err => {
          console.warn('No se pudo registrar el service worker:', err);
        });
      });
    }
  </script>
</body>
</html>
